<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English &amp; Polish Voice Translator</title>
  <style>
    :root {
      --bg-colour: #f8fafc;
      --card-bg: #ffffff;
      --en-colour: #2563eb;
      --en-hover: #1d4ed8;
      --pl-colour: #dc2626;
      --pl-hover: #b91c1c;
      --active-green: #059669;
      --turn-glow: #facc15;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-colour: #e2e8f0;
      --panel-bg: #f1f5f9;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --error-colour: #b91c1c;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-colour);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
    }

    .card {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border-colour);
    }

    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 1.5rem; margin: 0 0 10px; }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--panel-bg);
      color: var(--text-muted);
      transition: background 0.3s ease, color 0.3s ease;
    }
    .status-badge.listening {
      background: var(--active-green);
      color: #fff;
      animation: pulse 1.4s infinite;
    }
    .status-badge.speaking {
      background: var(--en-colour);
      color: #fff;
      animation: pulse 1.4s infinite;
    }
    .status-badge.error {
      background: #fee2e2;
      color: var(--error-colour);
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(5, 150, 105, 0); }
      100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); }
    }

    .notice {
      font-size: 0.85rem;
      line-height: 1.4;
      background: var(--warn-bg);
      color: var(--warn-text);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .notice.hidden { display: none; }
    .help-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 16px;
      text-align: center;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      background: var(--panel-bg);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .mode-switch button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .mode-switch button.active {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.1);
    }

    .stop-btn {
      display: none;
      width: 100%;
      margin-bottom: 16px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--text-main);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .stop-btn.visible { display: block; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .mic-btn {
      border: none;
      border-radius: var(--radius);
      padding: 22px 10px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }
    .mic-btn small { font-weight: 400; font-size: 0.8rem; opacity: 0.9; }
    .mic-btn:active { transform: scale(0.97); }
    .mic-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #btnEn { background: var(--en-colour); }
    #btnEn:hover:not(:disabled) { background: var(--en-hover); }
    #btnPl { background: var(--pl-colour); }
    #btnPl:hover:not(:disabled) { background: var(--pl-hover); }
    .mic-btn.active-turn {
      box-shadow: 0 0 0 4px var(--turn-glow), 0 0 18px var(--turn-glow);
    }

    .panel {
      background: var(--panel-bg);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      min-height: 70px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .panel-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .panel-text { font-size: 1.1rem; line-height: 1.45; word-wrap: break-word; }
    .panel-text.interim { color: var(--text-muted); font-style: italic; }
    .replay-btn {
      border: 1px solid var(--border-colour);
      background: var(--card-bg);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .manual-input { margin-top: 16px; }
    .direction-toggle {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .direction-toggle button {
      flex: 1;
      border: 2px solid var(--border-colour);
      background: var(--card-bg);
      border-radius: 8px;
      padding: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
    }
    .direction-toggle button.active[data-lang="en"] { border-color: var(--en-colour); color: var(--en-colour); }
    .direction-toggle button.active[data-lang="pl"] { border-color: var(--pl-colour); color: var(--pl-colour); }
    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-colour);
      font-size: 1rem;
    }
    .input-row button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--active-green);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>🇬🇧 English ⇄ Polish 🇵🇱</h1>
      <span id="statusBadge" class="status-badge" role="status" aria-live="polite">Ready</span>
    </header>

    <div id="supportNotice" class="notice hidden"></div>

    <div class="mode-switch" role="group" aria-label="Mode">
      <button id="modeManual" class="active" type="button" onclick="setMode('manual')">Manual Mode</button>
      <button id="modeAuto" type="button" onclick="setMode('auto')">Hands-Free Loop</button>
    </div>

    <button id="btnStop" class="stop-btn" type="button" onclick="stopLoop()">⏹ Stop Hands-Free Loop</button>

    <div class="controls">
      <button id="btnEn" class="mic-btn" type="button" onclick="handleMicClick('en')">
        🎤 Speak English
        <small>Translates to Polish</small>
      </button>
      <button id="btnPl" class="mic-btn" type="button" onclick="handleMicClick('pl')">
        🎤 Mów po polsku
        <small>Translates to English</small>
      </button>
    </div>

    <section class="panel">
      <div class="panel-header">
        <span id="sourceLabel" class="panel-label">Heard</span>
      </div>
      <div id="sourceText" class="panel-text">...</div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <span id="targetLabel" class="panel-label">Translation</span>
        <button id="btnReplay" class="replay-btn" type="button" onclick="replaySpeech()">🔊 Replay</button>
      </div>
      <div id="targetText" class="panel-text">...</div>
    </section>

    <section class="manual-input">
      <div class="direction-toggle" role="group" aria-label="Typed text language">
        <button id="typeEn" data-lang="en" class="active" type="button" onclick="setTypedLang('en')">Type English → Polski</button>
        <button id="typePl" data-lang="pl" type="button" onclick="setTypedLang('pl')">Pisz po polsku → English</button>
      </div>
      <div class="input-row">
        <input id="textInput" type="text" placeholder="Type English text here..." autocomplete="off">
        <button id="btnTranslate" type="button" onclick="translateTyped()">Translate</button>
      </div>
    </section>

    <p class="help-note">
      Open this page over <strong>https://</strong> or <strong>http://localhost</strong>, or as a local file in Chrome or Edge,
      and allow microphone access when asked. Speech recognition works in Chrome, Edge and Safari; Firefox can use typed text only.
    </p>
  </main>

  <script>
    'use strict';

    // ---------- Elements ----------
    const statusBadge = document.getElementById('statusBadge');
    const supportNotice = document.getElementById('supportNotice');
    const btnEn = document.getElementById('btnEn');
    const btnPl = document.getElementById('btnPl');
    const btnStop = document.getElementById('btnStop');
    const modeManualBtn = document.getElementById('modeManual');
    const modeAutoBtn = document.getElementById('modeAuto');
    const sourceLabel = document.getElementById('sourceLabel');
    const sourceTextEl = document.getElementById('sourceText');
    const targetLabel = document.getElementById('targetLabel');
    const targetTextEl = document.getElementById('targetText');
    const textInput = document.getElementById('textInput');

    // ---------- State ----------
    let mode = 'manual';          // 'manual' | 'auto'
    let loopActive = false;       // hands-free loop running
    let currentLang = 'en';       // whose turn it is: 'en' | 'pl'
    let typedLang = 'en';         // language of typed text
    let lastTranslation = '';
    let lastTargetLocale = 'pl-PL';
    let turnHandled = false;      // guards against translating one turn twice
    let lastInterim = '';
    let lastError = '';
    let session = 0;              // bumps on stop/new turn to cancel stale callbacks
    let pendingTimer = null;
    let voices = [];
    let speechUnlocked = false;

    const RELISTEN_DELAY_MS = 600;   // after no-speech in the loop
    const ECHO_GUARD_MS = 400;       // after TTS before re-listening
    const FETCH_TIMEOUT_MS = 10000;
    const FATAL_ERRORS = ['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'];

    // ---------- Support checks ----------
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    const ttsSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
    let recognition = null;

    (function checkSupport() {
      const notes = [];
      if (!SpeechRecognitionCtor) {
        notes.push('Speech recognition is not supported in this browser (for example Firefox). Use Chrome, Edge or Safari to speak, or type below — typed translation still works here.');
        btnEn.disabled = true;
        btnPl.disabled = true;
        modeAutoBtn.disabled = true;
      }
      if (!ttsSupported) {
        notes.push('Text-to-speech is not available in this browser, so translations will be shown but not spoken.');
      }
      if (!window.isSecureContext && location.protocol !== 'file:') {
        notes.push('This page is not on a secure connection. The microphone only works over https://, on localhost, or when opened as a local file in Chrome or Edge.');
      }
      if (notes.length) {
        supportNotice.innerHTML = notes.map(n => '<div>⚠️ ' + escapeHtml(n) + '</div>').join('');
        supportNotice.classList.remove('hidden');
      }
    })();

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---------- Speech recognition ----------
    if (SpeechRecognitionCtor) {
      recognition = new SpeechRecognitionCtor();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        updateUIState('listening');
      };

      recognition.onresult = (event) => {
        if (turnHandled) return;
        let finalText = '';
        let interimText = '';
        for (let i = 0; i < event.results.length; i++) {
          const r = event.results[i];
          if (r.isFinal) finalText += r[0].transcript;
          else interimText += r[0].transcript;
        }
        const shown = (finalText + ' ' + interimText).trim();
        lastInterim = shown;
        sourceTextEl.textContent = shown || 'Listening...';
        sourceTextEl.classList.toggle('interim', !!interimText && !finalText);

        const last = event.results[event.results.length - 1];
        if (last && last.isFinal) {
          const text = finalText.trim();
          if (!text) return;
          turnHandled = true;
          sourceTextEl.classList.remove('interim');
          sourceTextEl.textContent = text;
          try { recognition.stop(); } catch (e) { /* already stopped */ }
          processTranslation(text, currentLang, { fromSpeech: true });
        }
      };

      recognition.onerror = (event) => {
        lastError = event.error || 'unknown';
        if (FATAL_ERRORS.includes(lastError)) {
          const msg = lastError === 'not-allowed' || lastError === 'service-not-allowed'
            ? 'Microphone blocked. Allow microphone access and try again.'
            : lastError === 'audio-capture'
              ? 'No microphone found.'
              : 'This language is not supported by your browser\'s speech recognition.';
          loopActive = false;
          refreshStopButton();
          setStatus(msg, 'error');
        }
        // 'no-speech', 'aborted' and 'network' are handled in onend
      };

      recognition.onend = () => {
        if (turnHandled) return; // translation pipeline owns the next step
        const mySession = session;

        // Recogniser ended with interim text but no final result: use what we heard.
        if (lastInterim && lastError !== 'aborted') {
          turnHandled = true;
          const text = lastInterim;
          sourceTextEl.classList.remove('interim');
          sourceTextEl.textContent = text;
          processTranslation(text, currentLang, { fromSpeech: true });
          return;
        }

        if (FATAL_ERRORS.includes(lastError)) return; // status already shows the error

        if (mode === 'auto' && loopActive && lastError !== 'aborted') {
          // No speech heard: keep the same speaker's turn and listen again.
          sourceTextEl.textContent = 'Nothing heard — listening again...';
          schedule(() => { if (mySession === session && loopActive) startListening(); }, RELISTEN_DELAY_MS);
          return;
        }

        if (lastError === 'no-speech') {
          sourceTextEl.textContent = 'Nothing heard. Tap a button to try again.';
        } else if (lastError === 'network') {
          sourceTextEl.textContent = 'Speech recognition needs an internet connection.';
        } else if (sourceTextEl.textContent === 'Listening...') {
          sourceTextEl.textContent = '...';
        }
        updateUIState('ready');
      };
    }

    // ---------- Mode handling ----------
    function setMode(newMode) {
      // Tapping Hands-Free Loop while it is running stops it.
      if (newMode === 'auto' && mode === 'auto' && loopActive) {
        stopLoop();
        return;
      }
      if (newMode === mode) return;
      stopAll();
      mode = newMode;
      loopActive = false;
      modeManualBtn.classList.toggle('active', mode === 'manual');
      modeAutoBtn.classList.toggle('active', mode === 'auto');
      refreshStopButton();
      updateUIState('ready');
    }

    function stopLoop() {
      loopActive = false;
      stopAll();
      refreshStopButton();
      updateUIState('ready');
    }

    function stopAll() {
      session++;
      clearPending();
      turnHandled = true; // makes any late onend/onresult a no-op
      if (recognition) { try { recognition.abort(); } catch (e) { /* ignore */ } }
      if (ttsSupported) window.speechSynthesis.cancel();
    }

    function refreshStopButton() {
      btnStop.classList.toggle('visible', mode === 'auto' && loopActive);
      modeAutoBtn.textContent = mode === 'auto' && loopActive ? 'Hands-Free Loop (tap to stop)' : 'Hands-Free Loop';
    }

    function schedule(fn, ms) {
      clearPending();
      pendingTimer = setTimeout(() => { pendingTimer = null; fn(); }, ms);
    }
    function clearPending() {
      if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
    }

    // ---------- Mic ----------
    function handleMicClick(lang) {
      if (!recognition) return;
      unlockSpeech();
      stopAll();
      currentLang = lang;
      if (mode === 'auto') {
        loopActive = true;   // clicking a mic in auto mode starts the loop on that language
        refreshStopButton();
      }
      // Give abort() a moment to settle before restarting (Chrome/Safari).
      const mySession = session;
      schedule(() => { if (mySession === session) startListening(); }, 150);
    }

    function startListening() {
      if (!recognition) return;
      session++;
      turnHandled = false;
      lastInterim = '';
      lastError = '';
      recognition.lang = currentLang === 'en' ? 'en-GB' : 'pl-PL';

      sourceLabel.textContent = currentLang === 'en' ? 'Heard (English)' : 'Usłyszano (Polski)';
      targetLabel.textContent = currentLang === 'en' ? 'Translation (Polski)' : 'Translation (English)';
      sourceTextEl.classList.remove('interim');
      sourceTextEl.textContent = 'Listening...';
      targetTextEl.textContent = '...';

      highlightTurn(currentLang);

      try {
        recognition.start();
      } catch (e) {
        // Already started (InvalidStateError): restart cleanly.
        try { recognition.abort(); } catch (e2) { /* ignore */ }
        const mySession = session;
        schedule(() => {
          if (mySession !== session) return;
          try { recognition.start(); } catch (e3) { updateUIState('ready'); }
        }, 250);
      }
    }

    // ---------- Translation ----------
    async function fetchTranslation(text, sourceLang, targetLang) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS) : null;
      try {
        const res = await fetch(url, controller ? { signal: controller.signal } : undefined);
        if (!res.ok) {
          throw new Error(res.status === 429
            ? 'Translation service is busy (too many requests). Wait a moment and try again.'
            : `Translation service error (HTTP ${res.status}).`);
        }
        let data;
        try { data = await res.json(); } catch (e) { throw new Error('Unexpected response from translation service.'); }
        if (!Array.isArray(data) || !Array.isArray(data[0])) {
          throw new Error('Unexpected response from translation service.');
        }
        const translated = data[0]
          .map(segment => (Array.isArray(segment) && typeof segment[0] === 'string') ? segment[0] : '')
          .join('')
          .trim();
        if (!translated) throw new Error('No translation returned.');
        return translated;
      } catch (err) {
        if (err && err.name === 'AbortError') throw new Error('Translation timed out. Check your connection.');
        if (err instanceof TypeError) throw new Error('Translation failed. Check your connection.');
        throw err;
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    async function processTranslation(text, sourceLang, opts = {}) {
      const fromSpeech = !!opts.fromSpeech;
      if (!text) {
        updateUIState('ready');
        return;
      }
      const mySession = session;
      setStatus('Translating...');
      const targetLang = sourceLang === 'en' ? 'pl' : 'en';

      let translated;
      try {
        translated = await fetchTranslation(text, sourceLang, targetLang);
      } catch (err) {
        if (mySession !== session) return;
        targetTextEl.textContent = '—';
        setStatus(err.message || 'Translation failed. Check connection.', 'error');
        highlightTurn(mode === 'auto' && loopActive ? currentLang : null);
        if (fromSpeech && mode === 'auto' && loopActive) {
          // Let the same speaker try again after a short pause.
          schedule(() => { if (mySession === session && loopActive) startListening(); }, 2000);
        }
        return;
      }
      if (mySession !== session) return; // stopped or superseded meanwhile

      targetTextEl.textContent = translated;
      lastTranslation = translated;
      lastTargetLocale = targetLang === 'pl' ? 'pl-PL' : 'en-GB';

      speakText(translated, lastTargetLocale, () => {
        if (mySession !== session) return;
        if (fromSpeech && mode === 'auto' && loopActive) {
          currentLang = currentLang === 'en' ? 'pl' : 'en';
          highlightTurn(currentLang);
          setStatus(currentLang === 'en' ? 'Next: English speaker' : 'Next: Polish speaker');
          // Echo guard so the mic doesn't pick up our own speaker output.
          schedule(() => { if (mySession === session && loopActive) startListening(); }, ECHO_GUARD_MS);
        } else {
          updateUIState('ready');
        }
      });
    }

    // ---------- Text-to-speech ----------
    function loadVoices() {
      if (!ttsSupported) return;
      const v = window.speechSynthesis.getVoices();
      if (v && v.length) voices = v;
    }
    if (ttsSupported) {
      loadVoices();
      if ('onvoiceschanged' in window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      } else if (window.speechSynthesis.addEventListener) {
        window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
      }
    }

    function pickVoice(locale) {
      if (!voices.length) loadVoices();
      const want = locale.toLowerCase();
      const prefix = want.split('-')[0];
      const norm = v => (v.lang || '').replace('_', '-').toLowerCase();
      const exact = voices.filter(v => norm(v) === want);
      const pool = exact.length ? exact : voices.filter(v => norm(v).split('-')[0] === prefix);
      if (!pool.length) return null;
      // Prefer higher-quality voices where the name hints at it.
      return pool.find(v => /google|natural|neural|premium|enhanced/i.test(v.name)) ||
             pool.find(v => v.localService) || pool[0];
    }

    function splitIntoChunks(text, maxLen = 160) {
      const sentences = text.match(/[^.!?…]+[.!?…]+["'”»)]*\s*|[^.!?…]+$/g) || [text];
      const chunks = [];
      for (let s of sentences) {
        s = s.trim();
        if (!s) continue;
        while (s.length > maxLen) {
          let cut = Math.max(s.lastIndexOf(', ', maxLen), s.lastIndexOf('; ', maxLen));
          if (cut < maxLen * 0.4) cut = s.lastIndexOf(' ', maxLen);
          if (cut <= 0) cut = maxLen;
          chunks.push(s.slice(0, cut + 1).trim());
          s = s.slice(cut + 1).trim();
        }
        if (s) chunks.push(s);
      }
      return chunks.length ? chunks : [text];
    }

    function unlockSpeech() {
      // iOS Safari only allows speech after a user gesture: prime it on the first tap.
      if (speechUnlocked || !ttsSupported) return;
      speechUnlocked = true;
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        window.speechSynthesis.speak(u);
      } catch (e) { /* ignore */ }
    }

    function speakText(text, locale, onComplete) {
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        if (onComplete) onComplete();
      };

      if (!ttsSupported) {
        setStatus('Text-to-speech not supported.');
        done();
        return;
      }

      const synth = window.speechSynthesis;
      synth.cancel();
      const chunks = splitIntoChunks(text);
      const voice = pickVoice(locale);
      let index = 0;
      let chunkTimer = null;

      const speakNext = () => {
        if (finished) return;
        if (index >= chunks.length) { done(); return; }
        const chunk = chunks[index++];
        const utterance = new SpeechSynthesisUtterance(chunk);
        utterance.lang = locale;
        if (voice) utterance.voice = voice;
        utterance.rate = 1;

        let advanced = false;
        const next = () => {
          if (advanced) return;
          advanced = true;
          if (chunkTimer) { clearTimeout(chunkTimer); chunkTimer = null; }
          speakNext();
        };

        utterance.onstart = () => updateUIState('speaking');
        utterance.onend = next;
        utterance.onerror = next;

        // Safety net: if onend never fires (Chrome bug), move on anyway.
        const estimateMs = 2500 + chunk.length * 110;
        chunkTimer = setTimeout(() => {
          if (advanced) return;
          if (synth.speaking) {
            // Still talking: give it a little more time once, then force it.
            chunkTimer = setTimeout(() => { if (!advanced) { synth.cancel(); next(); } }, 4000);
          } else {
            next();
          }
        }, estimateMs);

        synth.speak(utterance);
        // Chrome sometimes leaves the queue paused.
        if (synth.paused) synth.resume();
      };

      // Small delay after cancel() avoids Chrome dropping the next utterance.
      setTimeout(speakNext, 60);
    }

    function replaySpeech() {
      if (lastTranslation) {
        unlockSpeech();
        speakText(lastTranslation, lastTargetLocale, () => updateUIState('ready'));
      }
    }

    // ---------- Typed fallback ----------
    function setTypedLang(lang) {
      typedLang = lang;
      document.getElementById('typeEn').classList.toggle('active', lang === 'en');
      document.getElementById('typePl').classList.toggle('active', lang === 'pl');
      textInput.placeholder = lang === 'en' ? 'Type English text here...' : 'Wpisz tekst po polsku...';
      textInput.lang = lang === 'en' ? 'en-GB' : 'pl-PL';
      textInput.focus();
    }

    async function translateTyped() {
      const text = textInput.value.trim();
      if (!text) return;

      unlockSpeech();
      // Typing interrupts any listening/speaking and pauses the loop.
      if (loopActive) { loopActive = false; refreshStopButton(); }
      stopAll();

      const lang = typedLang;
      currentLang = lang;
      sourceLabel.textContent = lang === 'en' ? 'Typed (English)' : 'Wpisano (Polski)';
      targetLabel.textContent = lang === 'en' ? 'Translation (Polski)' : 'Translation (English)';
      sourceTextEl.classList.remove('interim');
      sourceTextEl.textContent = text;
      targetTextEl.textContent = '...';
      textInput.value = '';

      await processTranslation(text, lang, { fromSpeech: false });
    }

    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); translateTyped(); }
    });

    // ---------- UI state ----------
    function highlightTurn(lang) {
      btnEn.classList.toggle('active-turn', lang === 'en');
      btnPl.classList.toggle('active-turn', lang === 'pl');
    }

    function updateUIState(state) {
      if (state === 'listening') {
        highlightTurn(currentLang);
        setStatus(currentLang === 'en' ? 'Listening for English...' : 'Słucham po polsku...', 'listening');
      } else if (state === 'speaking') {
        setStatus('Speaking translation...', 'speaking');
      } else {
        // In a running loop keep the glow on whoever speaks next.
        highlightTurn(mode === 'auto' && loopActive ? currentLang : null);
        if (mode === 'auto') {
          setStatus(loopActive ? 'Hands-Free Loop running' : 'Hands-Free Loop ready — tap a button to start');
        } else {
          setStatus('Ready — Click a button to speak');
        }
      }
    }

    function setStatus(msg, className = '') {
      statusBadge.textContent = msg;
      statusBadge.className = 'status-badge' + (className ? ' ' + className : '');
    }

    updateUIState('ready');
  </script>
</body>
</html>
